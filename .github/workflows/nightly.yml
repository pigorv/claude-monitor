  # a11y:
  #   Accessibility checks (L5). Deferred to a sibling issue of #132.
  #   name: Accessibility
  #   needs: build
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 20
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 22

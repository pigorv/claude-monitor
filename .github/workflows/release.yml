name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm run coverage

  publish:
    name: Publish to npm
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 ships npm 10.x.
      - run: npm install -g npm@latest

      - run: npm publish --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes

# Release-tier extras (tracked for sibling issues, see docs/TESTING.md):
#   - Packaged-tarball acceptance: pack the published artifact and smoke-test
#     it as a consumer would install it (`npm pack` → install → run).
#   - Migration upgrade-path: verify the DB schema migrations apply cleanly
#     against a prior-version database before publish.
#   - Full pyramid: run the complete unit + integration + e2e suite as the
#     release-tier gate.

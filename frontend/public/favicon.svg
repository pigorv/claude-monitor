<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #f7f5f2; }
    .bar { fill: #1c1917; }
    .accent { fill: #6d28d9; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c1917; }
      .bar { fill: #fffffe; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="6" />
  <rect class="accent" x="6" y="6"  width="20" height="5" rx="1.5" />
  <rect class="bar"    x="6" y="13" width="20" height="5" rx="1.5" />
  <rect class="bar"    x="6" y="20" width="20" height="5" rx="1.5" />
</svg>
